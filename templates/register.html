<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/static/js/theme-init.js"></script>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101c29"><link rel="icon" href="/favicon.ico"><link rel="manifest" href="/manifest.json">
    <title>注册</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script><script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/themes.css"><link rel="stylesheet" href="/static/css/login.css?v=20260908-1">
    <script src="/static/js/auth-background.js" defer></script>
</head>
<body class="signin-page">
    <div class="signin-backdrop" aria-hidden="true"><div class="auth-stage__slides" data-auth-slideshow>
        <div class="auth-stage__slide is-active" style="background-image:url('/static/images/wp/atri-my-dear-moments-anime-review-a-submerged-tale-of-human-android-connection-3317236.webp')"></div>
        <div class="auth-stage__slide" style="background-image:url('/static/images/wp/atri_pv2screenshot.webp')"></div><div class="auth-stage__slide" style="background-image:url('/static/images/wp/unnamed.png')"></div><div class="auth-stage__slide" style="background-image:url('/static/images/wp/unnamed.webp')"></div>
    </div></div>
    <header class="signin-brand"><img src="/static/images/logo.svg" alt="" width="30" height="30"><span class="signin-brand-note">订阅管理</span></header>
    <main class="signin-layout"><div aria-hidden="true"></div><section class="signin-form-section" aria-labelledby="register-title"><div class="signin-form-wrap">
        <span class="signin-eyebrow">CREATE ACCOUNT</span><h2 id="register-title">注册账户</h2>
        <form hx-post="/api/auth/register" hx-target="#register-error" hx-swap="innerHTML" hx-disabled-elt="find button[type='submit']">
            <div class="signin-control"><label for="username">用户名</label><div class="signin-input-wrap"><input type="text" id="username" name="username" required autofocus autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="输入用户名"></div></div>
            <div class="signin-control"><label for="password">密码</label><div class="signin-input-wrap"><input type="password" id="password" name="password" minlength="8" required autocomplete="new-password" placeholder="输入密码"></div></div>
            <div class="signin-control"><label for="confirm_password">确认密码</label><div class="signin-input-wrap"><input type="password" id="confirm_password" name="confirm_password" minlength="8" required autocomplete="new-password" placeholder="再次输入密码"></div></div>
            <label class="signin-remember" for="remember_me"><input type="checkbox" id="remember_me" name="remember_me"><span>30 天内保持登录</span></label>
            <div id="register-error" role="alert" aria-live="polite">{{if .Error}}<p>{{.Error}}</p>{{end}}</div>
            <button type="submit" class="signin-submit"><span>注册账户</span><span aria-hidden="true">→</span></button>
            <p class="signin-register">已有账户？ <a href="/login">登录 <span aria-hidden="true">↗</span></a></p>
        </form>
    </div></section></main>
</body></html>
