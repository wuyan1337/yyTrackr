<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <script src="/static/js/theme-init.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101c29">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <title>登录</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="/static/css/login.css?v=20260908-1">
    <script src="/static/js/auth-background.js" defer></script>
    <script src="/static/js/login.js?v=20260908-1" defer></script>
</head>
<body class="signin-page">
    <div class="signin-backdrop" aria-hidden="true">
        <div class="auth-stage__slides" data-auth-slideshow>
            <div class="auth-stage__slide is-active" style="background-image:url('/static/images/wp/atri-my-dear-moments-anime-review-a-submerged-tale-of-human-android-connection-3317236.webp')"></div>
            <div class="auth-stage__slide" style="background-image:url('/static/images/wp/atri_pv2screenshot.webp')"></div>
            <div class="auth-stage__slide" style="background-image:url('/static/images/wp/unnamed.png')"></div>
            <div class="auth-stage__slide" style="background-image:url('/static/images/wp/unnamed.webp')"></div>
        </div>
    </div>
    <header class="signin-brand"><img src="/static/images/logo.svg" alt="" width="30" height="30"><span class="signin-brand-note">订阅管理</span></header>
    <main class="signin-layout">
        <div aria-hidden="true"></div>
        <section class="signin-form-section" aria-labelledby="signin-title">
            <div class="signin-form-wrap">
                <span class="signin-eyebrow">WELCOME BACK</span>
                <h2 id="signin-title">欢迎回来</h2>
                <form hx-post="/api/auth/login" hx-target="#login-error" hx-swap="innerHTML" hx-disabled-elt="find button[type='submit']">
                    <input type="hidden" name="redirect" value="{{.Redirect}}">
                    <div class="signin-control">
                        <label for="username">用户名</label>
                        <div class="signin-input-wrap" data-spotlight>
                            <input type="text" id="username" name="username" required autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="输入用户名">
                        </div>
                    </div>
                    <div class="signin-control">
                        <label for="password">密码</label>
                        <div class="signin-input-wrap" data-spotlight>
                            <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="输入密码">
                            <button class="signin-reveal" type="button" aria-label="显示密码" aria-controls="password" aria-pressed="false"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
                        </div>
                    </div>
                    <label class="signin-remember" for="remember_me"><input type="checkbox" id="remember_me" name="remember_me"><span>30 天内保持登录</span></label>
                    <div id="login-error" role="alert" aria-live="polite">{{if .Error}}<p>{{.Error}}</p>{{end}}</div>
                    <button type="submit" class="signin-submit"><span>登录</span><span aria-hidden="true">→</span></button>
                    <p class="signin-register">还没有账户？ <a href="/register">立即注册 <span aria-hidden="true">↗</span></a></p>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
