<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#37889b">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/static/images/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <title>{{.Title}} - SubTrackr</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'primary': '#3b82f6',
                        'success': '#10b981',
                        'warning': '#f59e0b',
                        'danger': '#ef4444',
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="/static/css/themes.css">
    <link rel="stylesheet" href="/static/css/app-ui.css?v=20260908-1">
    <link rel="stylesheet" href="/static/css/nav-unified.css?v=20260909-3">

</head>
<body class="app-ui anime-app-shell bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-gray-100 min-h-screen transition-colors duration-200">

                <div class="unified-actions"><a href="/settings" class="unified-link" aria-label="Settings"><svg aria-hidden="true" class="unified-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg></a><button type="button" id="mobile-menu-button" class="unified-button" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false"><svg class="unified-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button></div>
            </div>
            <div id="mobile-menu" class="unified-mobile-menu hidden" aria-hidden="true">
                <div class="unified-backdrop" onclick="closeMobileMenu()"></div>
                <div class="unified-mobile-panel">
                    <div class="unified-mobile-top"><img src="/static/images/logo.svg" alt="yyTrackr"><button type="button" class="unified-button" onclick="closeMobileMenu()" aria-label="Close menu"><svg class="unified-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
                    <nav class="unified-mobile-nav" aria-label="Mobile navigation"><a href="/" class="unified-link" aria-label="Dashboard" onclick="closeMobileMenu()"><svg class="unified-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10 12 3l9 7v11H3z M9 21v-7h6v7"/></svg><span>Dashboard</span></a><a href="/subscriptions" class="unified-link" aria-label="Subscriptions" onclick="closeMobileMenu()"><svg class="unified-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18H6z M9 8h6 M9 12h6 M9 16h4"/></svg><span>Subscriptions</span></a><a href="/analytics" class="unified-link" aria-label="Analytics" onclick="closeMobileMenu()"><svg class="unified-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16 M8 16v-4 M12 16V8 M16 16V5"/></svg><span>Analytics</span></a><a href="/calendar" class="unified-link unified-active" aria-label="Calendar" aria-current="page" onclick="closeMobileMenu()"><svg class="unified-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18v16H3z M8 3v4 M16 3v4 M3 10h18"/></svg><span>Calendar</span></a><a href="/settings" class="unified-link" aria-label="Settings" onclick="closeMobileMenu()"><svg aria-hidden="true" class="unified-icon" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg><span>Settings</span></a></nav>
                </div>
            </div>
        </header>

        <!-- Mobile Menu Overlay -->


        <!-- Main Content -->
        <main class="flex-1 p-4">
            <div class="max-w-7xl mx-auto">
                <!-- Calendar Header -->
                <div class="flex items-center justify-between mb-6">
                    <div class="flex items-center space-x-4">
                        <a href="/calendar?year={{.PrevMonth.Year}}&month={{printf "%d" (int .PrevMonth.Month)}}"
                           class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-150">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                            </svg>
                        </a>
                        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">{{.MonthName}}</h1>
                        <a href="/calendar?year={{.NextMonth.Year}}&month={{printf "%d" (int .NextMonth.Month)}}"
                           class="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-150">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                            </svg>
                        </a>
                        <a href="/calendar" class="ml-4 px-3 py-1 text-sm text-gray-600 dark:text-gray-400 hover:text-gray-900 dark:hover:text-white">
                            Today
                        </a>
                    </div>
                    <div class="flex items-center space-x-2">
                    </div>
                </div>

                <!-- Calendar Grid -->
                <div class="calendar-scroll bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700" tabindex="0" role="region" aria-label="Subscription calendar; scroll horizontally on small screens">
                    <!-- Day Headers -->
                    <div class="grid grid-cols-7 border-b border-gray-200 dark:border-gray-700">
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Sun</div>
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Mon</div>
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Tue</div>
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Wed</div>
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Thu</div>
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Fri</div>
                        <div class="px-4 py-3 text-center text-sm font-semibold text-gray-700 dark:text-gray-300 bg-gray-50 dark:bg-gray-900">Sat</div>
                    </div>

                    <!-- Calendar Days -->
                    <div class="grid grid-cols-7" id="calendar-grid">
                        <!-- Days will be populated by JavaScript -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50" style="z-index: 9999;">
        <div class="bg-white dark:bg-gray-800 rounded-lg max-w-2xl w-full max-h-[90vh] overflow-y-auto m-4 transition-colors duration-200" style="z-index: 10000;">
            <div id="modal-content">
                <!-- Dynamic content loaded here -->
            </div>
        </div>
    </div>

    <script>
        // Calendar data from server - parse JSON safely
        let eventsByDate = {};
        try {
            const eventsData = {{.EventsByDate}};
            if (typeof eventsData === 'string') {
                eventsByDate = JSON.parse(eventsData);
            } else if (typeof eventsData === 'object') {
                eventsByDate = eventsData;
            }
        } catch (e) {
            console.error('Error parsing eventsByDate:', e);
            eventsByDate = {};
        }

        const year = parseInt({{.Year}}) || new Date().getFullYear();
        const month = parseInt({{.Month}}) || new Date().getMonth() + 1;
        const currencySymbol = "{{.CurrencySymbol}}";

        console.log('Calendar initialized:', { year, month, eventsCount: Object.keys(eventsByDate).length });

        // Render calendar grid
        function renderCalendar() {
            const grid = document.getElementById('calendar-grid');
            if (!grid) {
                console.error('Calendar grid not found');
                return;
            }

            grid.innerHTML = '';

            const firstOfMonth = new Date(year, month - 1, 1);
            const lastOfMonth = new Date(year, month, 0);
            const daysInMonth = lastOfMonth.getDate();
            const startDay = firstOfMonth.getDay(); // 0 = Sunday, 6 = Saturday

            // Previous month days
            const prevMonth = new Date(year, month - 1, 0);
            const daysInPrevMonth = prevMonth.getDate();
            for (let i = startDay - 1; i >= 0; i--) {
                const day = daysInPrevMonth - i;
                const cell = document.createElement('div');
                cell.className = 'calendar-day calendar-outside';
                cell.innerHTML = `<div class="text-sm text-gray-400 dark:text-gray-600">${day}</div>`;
                grid.appendChild(cell);
            }

            // Current month days
            for (let day = 1; day <= daysInMonth; day++) {
                const dateKey = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const events = eventsByDate[dateKey] || [];
                const cell = document.createElement('div');
                const hasEvents = events.length > 0;
                cell.className = `calendar-day ${hasEvents ? 'calendar-day-has-events' : ''}`;

                let content = `<div class="calendar-date">${day}</div>`;
                if (hasEvents) {
                    content += '<div class="space-y-1">';
                    events.forEach(event => {
                        const eventName = (event.name || '').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                        const eventId = event.id || 0;
                        const iconURL = event.icon_url || '';
                        const hasIcon = iconURL && iconURL.trim() !== '';

                        let iconHtml = '';
                        if (hasIcon) {
                            const safeIconURL = iconURL.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
                            iconHtml = `<img src="${safeIconURL}" alt="${eventName}" class="w-3 h-3 rounded mr-1.5 flex-shrink-0 inline-block" style="object-fit: contain;" onerror="this.style.display='none';">`;
                        }

                        const cost = (event.cost || 0).toFixed(2);
                        content += `<button
                            hx-get="/form/subscription/${eventId}"
                            hx-target="#modal-content"
                            hx-swap="innerHTML"
                            hx-trigger="click"
                            class="calendar-event w-full text-left text-xs px-2 py-1 rounded transition-colors cursor-pointer flex items-center justify-between"
                            title="${eventName} - ${currencySymbol}${cost}"
                            onclick="setTimeout(function() { document.getElementById('modal').classList.remove('hidden'); }, 50);">
                            <span class="flex items-center min-w-0 flex-1">
                                ${iconHtml}<span class="truncate">${eventName}</span>
                            </span>
                            <span class="ml-2 flex-shrink-0 font-medium">${currencySymbol}${cost}</span>
                        </button>`;
                    });
                    content += '</div>';
                }
                cell.innerHTML = content;
                grid.appendChild(cell);

                // Process HTMX attributes on newly created buttons
                if (typeof htmx !== 'undefined') {
                    htmx.process(cell);
                }
            }

            // Next month days (fill remaining cells)
            const totalCells = grid.children.length;
            const remainingCells = 42 - totalCells; // 6 rows * 7 days = 42
            for (let day = 1; day <= remainingCells; day++) {
                const cell = document.createElement('div');
                cell.className = 'calendar-day calendar-outside';
                cell.innerHTML = `<div class="text-sm text-gray-400 dark:text-gray-600">${day}</div>`;
                grid.appendChild(cell);
            }
        }

        // Initialize calendar on page load
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', renderCalendar);
        } else {
            renderCalendar();
        }

        // Mobile menu functionality is handled by /static/js/mobile-menu.js

        // Close modal when clicking outside
        const modal = document.getElementById('modal');
        if (modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.add('hidden');
                }
            });
        }

        // Listen for HTMX afterSwap to show modal when content loads
        if (typeof htmx !== 'undefined') {
            document.body.addEventListener('htmx:afterSwap', function(evt) {
                if (evt.detail.target.id === 'modal-content' && evt.detail.target.innerHTML.trim() !== '') {
                    const modal = document.getElementById('modal');
                    if (modal) {
                        modal.classList.remove('hidden');
                    }
                }
            });
        }
    </script>
</body>
</html>
